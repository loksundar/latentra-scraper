# Scheduled job crawl — replaces the Windows Task Scheduler dependency on a
# single PC. run.bat remains as a manual/local fallback.
#
# Layout:
#   1. `sources` job fetches every source list ONCE (sequential, retried) and
#      publishes it as an artifact. Five parallel jobs hitting the sources API
#      at the same instant tripped Hostinger's WAF into intermittent 403s.
#   2. Spider matrix jobs read sources from the artifact (SOURCES_FILE) and
#      crawl in parallel — total wall time ≈ the slowest spider (workday).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   INGEST_URL    = https://latentra-technologies.com/api/jobs-ingest.php
#   SOURCES_URL   = https://latentra-technologies.com/api/jobs-sources.php
#   INGEST_TOKEN  = the ingest bearer token
#
# NOTE: scheduled workflows only run from the DEFAULT branch (main).

name: Scheduled job crawl

on:
  schedule:
    # 4 runs/day at about 6am, 9am, 12pm, 3pm Eastern — covers the East- and
    # West-coast posting waves. Cron is UTC (EDT = UTC-4); during EST
    # (winter) runs land an hour earlier in local time. Minute 7, not 0:
    # GitHub delays and drops top-of-the-hour schedules most. If one is
    # dropped anyway, crawl-watchdog.yml starts a crawl after a 5 h gap.
    - cron: "7 10,13,16,19 * * *"
  workflow_dispatch: {}      # manual trigger from the Actions tab

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    env:
      SOURCES_URL: ${{ secrets.SOURCES_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Last-known-good fallback: if Hostinger's WAF blocks the runner for the
      # whole retry window (seen twice on 2026-07-07), crawl with the cached
      # source list instead of failing. Sources change weekly at most; job
      # data is always fetched fresh from the ATS APIs regardless.
      - name: Restore last-known-good sources
        uses: actions/cache@v4
        with:
          path: scraper/sources-cache.json
          key: sources-cache-${{ github.run_id }}
          restore-keys: |
            sources-cache-

      - name: Fetch all source lists
        run: |
          if python fetch_sources.py sources.json; then
            cp sources.json sources-cache.json
          elif [ -f sources-cache.json ]; then
            echo "::warning::sources API blocked — crawling with last-known-good cached sources"
            cp sources-cache.json sources.json
          else
            echo "::warning::sources API blocked and no cache yet — using committed sources-fallback.json"
            cp sources-fallback.json sources.json
            cp sources.json sources-cache.json
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: sources
          path: scraper/sources.json
          retention-days: 2

  # Big spiders are split into shards (stable hash of company slug, see
  # loader._apply_shard) so each job stays well inside the 45-min watchdog as
  # discovery keeps adding companies. Public repo: runner minutes are free.
  crawl:
    name: crawl ${{ matrix.spider }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 6        # keep concurrent ingest POSTs under the WAF's radar
      matrix:
        include:
          - { spider: greenhouse,      shard: 1, shards: 2 }
          - { spider: greenhouse,      shard: 2, shards: 2 }
          - { spider: ashby,           shard: 1, shards: 2 }
          - { spider: ashby,           shard: 2, shards: 2 }
          - { spider: lever,           shard: 1, shards: 1 }
          - { spider: smartrecruiters, shard: 1, shards: 3 }
          - { spider: smartrecruiters, shard: 2, shards: 3 }
          - { spider: smartrecruiters, shard: 3, shards: 3 }
          - { spider: workable,        shard: 1, shards: 1 }
          - { spider: rippling,        shard: 1, shards: 1 }
          - { spider: gem,             shard: 1, shards: 1 }
          - { spider: oracle,          shard: 1, shards: 2 }
          - { spider: oracle,          shard: 2, shards: 2 }
          - { spider: amazon,          shard: 1, shards: 1 }
          - { spider: apple,           shard: 1, shards: 1 }
          - { spider: tiktok,          shard: 1, shards: 1 }
          - { spider: workday,         shard: 1, shards: 6 }
          - { spider: workday,         shard: 2, shards: 6 }
          - { spider: workday,         shard: 3, shards: 6 }
          - { spider: workday,         shard: 4, shards: 6 }
          - { spider: workday,         shard: 5, shards: 6 }
          - { spider: workday,         shard: 6, shards: 6 }
    defaults:
      run:
        working-directory: scraper
    env:
      INGEST_URL: ${{ secrets.INGEST_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v5
        with:
          name: sources
          path: scraper

      - name: Crawl ${{ matrix.spider }} (shard ${{ matrix.shard }}/${{ matrix.shards }})
        env:
          SOURCES_FILE: sources.json
          SHARD_TOTAL: ${{ matrix.shards }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          export SHARD_INDEX=$((SHARD_INDEX - 1))   # matrix is 1-based, loader 0-based
          set -o pipefail
          timeout -k 60 3600 python -m scrapy crawl ${{ matrix.spider }} 2>&1 | tee crawl.log
          # The loader must have RUN (it logs "Loaded N active" even for N=0).
          # Zero configured sources is a legitimate no-op (e.g. smartrecruiters
          # currently has none); the loader never logging at all means the
          # sources file/API was unreachable — that fails loudly.
          if ! grep -qE "Loaded [0-9]+ active" crawl.log; then
            echo "::error::sources never loaded for ${{ matrix.spider }} — crawl was a broken no-op"
            exit 1
          fi
          # Ingest batches that never made it to the server are lost data.
          # Exact token, emitted only on permanent loss — fuzzy phrases once
          # false-alarmed on a server error echoed inside a retry warning.
          if grep -q "INGEST_BATCH_LOST" crawl.log; then
            echo "::error::one or more ingest batches were lost for ${{ matrix.spider }}"
            exit 1
          fi
          # Callback crashes mean the ATS changed its response format (e.g.
          # SmartRecruiters turning a text field into an object in Nov 2026,
          # which silently zeroed 50 companies). Fail the run so it shows red
          # and GitHub emails, instead of waiting for STALE alerts.
          EXC=$(grep -oE "'spider_exceptions/count': [0-9]+" crawl.log | grep -oE "[0-9]+$" | tail -1 || true)
          if [ "${EXC:-0}" -ge 5 ]; then
            echo "::error::${{ matrix.spider }} callbacks raised ${EXC} exceptions, the ATS response format probably changed"
            grep -oE "spider_exceptions/[A-Za-z]+': [0-9]+" crawl.log | sort -u || true
            grep -m3 -E "^[A-Za-z]+Error: " crawl.log || true
            exit 1
          fi
