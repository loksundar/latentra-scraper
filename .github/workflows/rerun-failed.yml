# Auto-rerun failed crawl jobs on fresh runners — up to TWO retries.
# Hostinger's WAF blocks runner IPs at random; a rerun gets new runners
# (new IPs), which clears the block in most cases. One rerun still left a few
# ashby/workday batches 403'd in Aug 2026, so a second, delayed retry is
# allowed. Guarded to attempts 1 and 2 only — no rerun loops.

name: Auto-rerun failed crawl

on:
  workflow_run:
    workflows: ["Scheduled job crawl"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt <= 2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rerun failed jobs (fresh runners, fresh IPs)
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Second retry waits so the WAF's rate window cools down.
          if [ "$ATTEMPT" -ge 2 ]; then sleep 600; fi
          gh api -X POST "repos/${{ github.repository }}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "requested rerun of failed jobs for run ${RUN_ID} (after attempt ${ATTEMPT})"
